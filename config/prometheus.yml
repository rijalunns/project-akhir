global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'hyperheal-host'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'hyperheal-server'
    metrics_path: '/metrics'

  - job_name: 'proxmox-vms'
    static_configs:
      - targets:
        - '192.168.1.101:9100'
        - '192.168.1.102:9100'
        - '192.168.1.103:9100'
        labels:
          instance: 'vm-monitor'

rule_files:
  - 'alert_rules.yml'
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'hyperheal-host'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'hyperheal-server'

  - job_name: 'proxmox-vms'
    static_configs:
      - targets:
        - '192.168.1.101:9100'
        - '192.168.1.102:9100'
        - '192.168.1.103:9100'
